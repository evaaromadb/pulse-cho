# PULSE CHO — satu Web Service (Docker) berisi halaman + API.
# Di Render: New + > Web Service > Build & deploy from a Git repository,
#   Root Directory: (kosong)
#   Runtime: Docker
#   Dockerfile Path: ./Dockerfile
#   Health Check Path: /api/health.php
#
# Alternatif "Blueprint" (opsional) memakai file ini apa adanya;
# tidak wajib blueprint — form manual menghasilkan layanan yang sama.
services:
  - type: web
    name: pulse-cho
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health.php
    envVars:
      # Kredensial TiDB (isi di dashboard, jangan di-commit)
      - key: PULSE_TIDB_HOST
        sync: false
      - key: PULSE_TIDB_PORT
        value: "4000"
      - key: PULSE_TIDB_DATABASE
        value: pulse_cho
      - key: PULSE_TIDB_USERNAME
        sync: false
      - key: PULSE_TIDB_PASSWORD
        sync: false
      # Opsional: hanya bila memakai Secret File berisi CA TiDB.
      # Jika kosong, koneksi TLS tetap jalan memakai CA bawaan sistem.
      - key: PULSE_TIDB_CA_PATH
        value: /etc/secrets/tidb-ca.pem
      # UI dan API satu domain, jadi CORS tidak dibutuhkan.
      # Isi hanya jika API diakses dari domain lain.
      - key: PULSE_ALLOWED_ORIGIN
        value: ""
