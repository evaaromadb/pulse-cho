# PULSE CHO — satu Web Service (Docker) bernama pulse-cho-v2:
#   /            -> index.html (halaman aplikasi)
#   /api/*.php   -> API (auth, dataset, health)
# Di Render: New + > Web Service > Build & deploy from a Git repository,
#   Root Directory: (kosong)
#   Runtime: Docker
#   Dockerfile Path: ./Dockerfile
#   Health Check Path: /api/health.php
#
# Alternatif "Blueprint" (opsional) memakai file ini apa adanya;
# tidak wajib blueprint — form manual menghasilkan layanan yang sama.
services:
  - type: web
    name: pulse-cho-v2
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health.php
    envVars:
      # Kredensial TiDB (isi di dashboard, jangan di-commit)
      - key: PULSE_TIDB_HOST
        sync: false
      - key: PULSE_TIDB_PORT
        value: "4000"
      - key: PULSE_TIDB_DATABASE
        value: pulse_cho
      - key: PULSE_TIDB_USERNAME
        sync: false
      - key: PULSE_TIDB_PASSWORD
        sync: false
      # Opsional: isi dengan /etc/secrets/tidb-ca.pem bila memakai Secret File
      # bernama tidb-ca.pem. Jika dibiarkan kosong, koneksi TLS memakai CA
      # bawaan sistem operasi.
      - key: PULSE_TIDB_CA_PATH
        sync: false
      # Akun Admin awal: dibuat otomatis saat tabel pulse_users masih kosong.
      - key: PULSE_ADMIN_USERNAME
        sync: false
      - key: PULSE_ADMIN_PASSWORD
        sync: false
      - key: PULSE_ADMIN_NAME
        sync: false
      - key: PULSE_ADMIN_SITE
        sync: false
      # UI dan API satu domain, jadi CORS tidak dibutuhkan.
      # Isi hanya jika API diakses dari domain lain.
      - key: PULSE_ALLOWED_ORIGIN
        value: ""
