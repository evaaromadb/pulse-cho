file_uploads = On
upload_max_filesize = 250M
post_max_size = 260M
memory_limit = 1536M
max_execution_time = 300
max_input_time = 300

; Dataset besar dilayani per chunk; opcache mempercepat parsing skrip.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Streaming respons chunk tidak boleh ditahan buffer Apache/PHP.
output_buffering = Off
zlib.output_compression = Off
